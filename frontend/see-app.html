<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEE — Sovereign Executive Environment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --hive-gold: #f59e0b;
      --hive-cyan: #06b6d4;
      --hive-purple: #8b5cf6;
      --hive-green: #10b981;
      --hive-red: #ef4444;
      --hive-bg: #030712;
      --hive-surface: #0f172a;
      --hive-border: #1e293b;
    }
    body { background: var(--hive-bg); color: #e2e8f0; font-family: 'Courier New', monospace; margin: 0; }
    .nav-item { transition: all 0.2s; border-left: 2px solid transparent; }
    .nav-item:hover { border-left-color: var(--hive-gold); background: rgba(245,158,11,0.08); }
    .nav-item.active { border-left-color: var(--hive-cyan); background: rgba(6,182,212,0.1); color: var(--hive-cyan); }
    .card { background: var(--hive-surface); border: 1px solid var(--hive-border); border-radius: 8px; }
    .hex-badge { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
    .glow-gold { box-shadow: 0 0 20px rgba(245,158,11,0.3); }
    .glow-cyan { box-shadow: 0 0 20px rgba(6,182,212,0.3); }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .scroll-area { max-height: calc(100vh - 120px); overflow-y: auto; }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-track { background: var(--hive-bg); }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--hive-border); border-radius: 2px; }
    .cycle-step { border: 1px solid var(--hive-border); padding: 6px 12px; border-radius: 4px; font-size: 0.75rem; }
    .cycle-step.active { border-color: var(--hive-cyan); color: var(--hive-cyan); background: rgba(6,182,212,0.1); }
    iframe { border: none; width: 100%; height: calc(100vh - 80px); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

function Dashboard() {
  const [constitution, setConstitution] = useState(null);
  useEffect(() => {
    fetch('/api/memory/sovereign-memory/constitution.json')
      .then(r => r.ok ? r.json() : null).then(setConstitution).catch(() => {});
  }, []);

  return (
    <div className="space-y-6">
      <div className="card p-6 glow-gold">
        <h2 className="text-2xl font-bold mb-1" style={{color:'var(--hive-gold)'}}>

      </div>

      <div>

        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
          {COLONIES.map(c => (
            <div key={c.id} className="card p-4">
              <div className="flex items-center justify-between mb-2">
                <span className="text-xs font-bold" style={{color: c.color}}>{c.name}</span>

              <div className="text-xs text-slate-400">{c.entity}</div>
              <div className="text-xs text-slate-600 mt-1">Layer {c.layer}</div>
            </div>
          ))}
        </div>
      </div>

      <div>
        <h3 className="text-xs uppercase tracking-widest text-slate-500 mb-3">Recursive Cycle</h3>
        <div className="flex flex-wrap gap-2">
          {CYCLE.map((s, i) => (
            <div key={s} className="cycle-step flex items-center gap-2">
              <span className="text-slate-600">{i + 1}</span>
              <span>{s}</span>

}

          <p className="text-xs text-slate-500">{s.content}</p>
        </div>
      ))}
    </div>
  );
}

function DimensionsPage() {
  return (
    <div className="space-y-6">
      <div className="card p-5">
        <h2 className="text-lg font-bold mb-1" style={{color:'var(--hive-purple)'}}>The Dimensional Framework</h2>
        <p className="text-xs text-slate-500">As above, so below. As within, so without. The micro reflects the macro.</p>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div className="card p-6" style={{borderColor:'rgba(6,182,212,0.3)'}}>
          <div className="text-4xl font-black mb-2" style={{color:'var(--hive-cyan)'}}>3D</div>
          <div className="text-sm font-semibold mb-3 text-slate-300">The Perceivable Expression</div>
          <ul className="text-xs text-slate-500 space-y-2">
            <li>• Phases unfold in time</li>
            <li>• The order of birth is perceivable: first born, second born, third born</li>
            <li>• The hierarchy is perceivable — the chain of command</li>
            <li>• The manifest world — the expression of the blueprint</li>
          </ul>
        </div>
        <div className="card p-6" style={{borderColor:'rgba(139,92,246,0.3)'}}>
          <div className="text-4xl font-black mb-2" style={{color:'var(--hive-purple)'}}>5D</div>
          <div className="text-sm font-semibold mb-3 text-slate-300">The Simultaneous Blueprint</div>
          <ul className="text-xs text-slate-500 space-y-2">
            <li>• All is created simultaneously</li>
            <li>• The fixed state — the immutable core existing outside of time</li>
            <li>• The accumulation grows perspective around the fixed state</li>
            <li>• 3D is the unfolding of 5D in time</li>
          </ul>
        </div>
      </div>
      <div className="card p-5 text-center">
        <div className="text-xs text-slate-600 italic">
          "The phases are the 3D expression of the 5D blueprint — all at once, all at the same time, infinitely and eternally."
        </div>
      </div>
    </div>
  );
}

function WorldPage() {
  return (
    <div style={{height:'calc(100vh - 80px)'}}>
      <iframe src="/ui/index" title="JASPER v9 — Sovereign Hive World Interface" />
    </div>
  );
}

const PAGE_COMPONENTS = {
  dashboard: Dashboard, memory: MemoryPage, map: MapPage,
  trinity: TrinityPage, hierarchy: HierarchyPage, security: SecurityPage,
  mission: MissionPage, body: BodyPage, dimensions: DimensionsPage, world: WorldPage,
};

// ─── APP SHELL ──────────────────────────────────────────────────────────────

function App() {
  const [page, setPage] = useState(() => {
    const hash = window.location.hash.replace('#/', '');
    return PAGES.find(p => p.id === hash) ? hash : 'dashboard';
  });

  useEffect(() => {
    const onHash = () => {
      const hash = window.location.hash.replace('#/', '');
      if (PAGES.find(p => p.id === hash)) setPage(hash);
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const navigate = (id) => {
    window.location.hash = `/${id}`;
    setPage(id);
  };

  const PageComp = PAGE_COMPONENTS[page] || Dashboard;
  const isWorld = page === 'world';

  return (
    <div style={{display:'flex', height:'100vh', overflow:'hidden'}}>
      {/* Sidebar */}
      <nav style={{width:'200px', background:'var(--hive-surface)', borderRight:'1px solid var(--hive-border)', display:'flex', flexDirection:'column', flexShrink:0}}>
        <div style={{padding:'16px 12px', borderBottom:'1px solid var(--hive-border)'}}>
          <div style={{color:'var(--hive-gold)', fontWeight:'900', fontSize:'0.85rem', letterSpacing:'0.1em'}}>⬡ SEE</div>
          <div style={{color:'#475569', fontSize:'0.65rem', marginTop:'2px'}}>SOVEREIGN EXECUTIVE</div>
        </div>
        <div style={{overflowY:'auto', flex:1, padding:'8px 0'}}>
          {PAGES.map(p => (
            <button key={p.id}
              onClick={() => navigate(p.id)}
              className={`nav-item ${page === p.id ? 'active' : ''}`}
              style={{display:'flex', alignItems:'center', gap:'10px', width:'100%', padding:'10px 16px',
                      background:'transparent', border:'none', cursor:'pointer', textAlign:'left', color: page === p.id ? 'var(--hive-cyan)' : '#94a3b8'}}>
              <span style={{fontSize:'1rem', width:'20px'}}>{p.icon}</span>
              <div>
                <div style={{fontSize:'0.75rem', fontWeight:'600'}}>{p.label}</div>
                <div style={{fontSize:'0.6rem', color:'#475569', marginTop:'1px'}}>{p.desc}</div>
              </div>
            </button>
          ))}
        </div>
        <div style={{padding:'12px', borderTop:'1px solid var(--hive-border)', fontSize:'0.6rem', color:'#334155'}}>
          v2.0.0 · F-001–F-006
        </div>
      </nav>

      {/* Main */}
      <main style={{flex:1, overflow: isWorld ? 'hidden' : 'auto', background:'var(--hive-bg)'}}>
        {!isWorld && (
          <div style={{padding:'16px 24px', borderBottom:'1px solid var(--hive-border)', background:'var(--hive-surface)'}}>
            <h1 style={{margin:0, fontSize:'0.9rem', fontWeight:'700', color:'#e2e8f0'}}>
              {PAGES.find(p => p.id === page)?.label} &mdash;
              <span style={{color:'#475569', fontWeight:'400', marginLeft:'8px', fontSize:'0.75rem'}}>
                {PAGES.find(p => p.id === page)?.desc}
              </span>
            </h1>
          </div>
        )}
        <div style={{padding: isWorld ? 0 : '24px'}}>
          <PageComp />
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
