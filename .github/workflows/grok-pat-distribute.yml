name: Distribute PAT to Grok Bridge

on:
  workflow_dispatch: {}

jobs:
  distribute:
    name: Push secrets.PAT to Cloudflare Worker D1
    runs-on: ubuntu-latest

    steps:
      - name: Verify required secrets are present
        run: |
          missing=""
          [ -z "${{ secrets.PAT }}" ] && missing="$missing secrets.PAT"
          [ -z "${{ secrets.WORKER_ADMIN_KEY }}" ] && missing="$missing secrets.WORKER_ADMIN_KEY"
          [ -z "${{ secrets.GROK_BRIDGE_KEY }}" ] && missing="$missing secrets.GROK_BRIDGE_KEY"
          [ -z "${{ secrets.WORKER_URL }}" ] && missing="$missing secrets.WORKER_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "See docs/GROK_BRIDGE.md for setup instructions."
            exit 1
          fi
          echo "All required secrets are present ✅"

      - name: Push token to Cloudflare Worker D1
        env:
          GITHUB_PAT: ${{ secrets.PAT }}
          ADMIN_KEY: ${{ secrets.WORKER_ADMIN_KEY }}
          GROK_KEY: ${{ secrets.GROK_BRIDGE_KEY }}
          WORKER_BASE_URL: ${{ secrets.WORKER_URL }}
        run: |
          PAYLOAD=$(printf '{"admin_key":"%s","github_token":"%s","grok_key":"%s"}' \
            "$ADMIN_KEY" "$GITHUB_PAT" "$GROK_KEY")
          HTTP_STATUS=$(curl -s -o /tmp/worker_response.json -w "%{http_code}" \
            -X POST "${WORKER_BASE_URL}/v11/admin/grok-token" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD")
          BODY=$(cat /tmp/worker_response.json)
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Token stored in Cloudflare Worker D1"
            echo "Grok can now fetch it with: GROK_BRIDGE_KEY=<value> python3 scripts/grok_push.py ..."
          elif [ "$HTTP_STATUS" = "403" ]; then
            echo "::error::Worker returned 403 — WORKER_ADMIN_KEY mismatch or not set in Cloudflare dashboard"
            echo "Response: $BODY"
            exit 1
          else
            echo "::error::Worker returned HTTP $HTTP_STATUS"
            echo "Response: $BODY"
            exit 1
          fi

      - name: Verify token is retrievable
        env:
          GROK_KEY: ${{ secrets.GROK_BRIDGE_KEY }}
          WORKER_BASE_URL: ${{ secrets.WORKER_URL }}
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/verify_response.json -w "%{http_code}" \
            -H "X-Grok-Key: ${GROK_KEY}" \
            "${WORKER_BASE_URL}/v11/bridge/grok-token")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Token is retrievable by Grok — bridge is fully operational"
          else
            BODY=$(cat /tmp/verify_response.json)
            echo "::warning::Verification returned HTTP $HTTP_STATUS — bridge may need a moment to propagate"
            echo "Response: $BODY"
          fi
