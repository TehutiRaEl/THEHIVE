name: Kai Sandbox Run

# Kai El's real sandbox (2026-08-18): the founder wants Kai El to actually build
# inside a venture repo, with every finished piece of work landing as a PUSH TO A
# BRANCH — never directly to that repo's main — so the PR itself is the proposal and
# merging it is the founder's real approval, the same role
# POST /v11/proposals/:id/decide plays for text/diff proposals.
#
# Why this workflow, and not wiring the Command Center's HiveTerminal.tsx to a real
# shell: that component's own header comment already explains a previous session
# checked this exact idea and declined — "wiring a public frontend to run real
# commands would be a genuine remote-code-execution hole." That reasoning still
# holds. Execution here instead happens on GitHub's own ephemeral hosted runner,
# which dies at the end of the run — never inside the Worker, never in a browser tab.
#
# Cross-repo checkout/push/PR needs a real PAT (default GITHUB_TOKEN is
# THEHIVE-scoped only) — same guard-and-degrade convention as
# federation-issue-triage.yml and venture-gap-mirror.yml, reusing
# HIVE_FEDERATION_TOKEN. No schedule trigger on purpose: every run starts from an
# explicit workflow_dispatch, which by itself already satisfies
# KAI_SANDBOX_AUTONOMY's real purpose (gating who may START a run) — a future
# autonomous/scheduled trigger should check GET /v11/kai/autonomy for
# KAI_SANDBOX_AUTONOMY before firing unattended, but that is not built here.
#
# ── Step 3 mechanism: automaton, adapted (2026-08-18) ──────────────────────────
# Three real candidates were weighed (the Claude Code CLI/Action this session runs
# under; automaton's own policy-gated exec()/write_target_file loop; a new agent
# loop built from scratch on the Worker's generate()) — automaton won because it
# already had the real, reviewed pieces: a genuine ReAct loop (agent/loop.js), a
# policy engine with real gap-closure-tested safety rules, and an inference layer
# that ALREADY calls THEHIVE's own multi-provider generate() waterfall
# (inference/thehive-provider.js -> POST /v11/automaton/infer) — so this run is
# never locked to one AI provider, satisfying the founder's explicit "not
# Claude-only" direction for free. Full comparison of all three candidates:
# TehutiRaEl/venture's ventures/venture/NOTES.md. New pieces added for this: config.js's
# AUTOMATON_REPO_ROOT override, tools.js's write_target_file (deliberately NOT the
# policy-anticipated `write_file` name — that one means self-modification, this
# means writing into a different, external repo, and conflating the two would make
# an accurate safety message read as a lie), and index.js's `--task` one-shot mode.

on:
  workflow_dispatch:
    inputs:
      venture_repo:
        description: 'Target venture repo, e.g. TehutiRaEl/SVFG'
        required: true
      task:
        description: 'What Kai El should build/change'
        required: true
      linked_gap_id:
        description: 'Optional: the venture_capability_gaps id this run follows up on'
        required: false

jobs:
  sandbox-run:
    name: Real sandbox run — branch + PR, never a push to main
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.HIVE_FEDERATION_TOKEN }}
    steps:
      - name: Guard — honest no-op if the federation token isn't bound yet
        id: guard
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "No HIVE_FEDERATION_TOKEN bound (or it doesn't cover ${{ inputs.venture_repo }} yet)."
            echo "This run genuinely does nothing, on purpose."
            echo "bound=false" >> "$GITHUB_OUTPUT"
          else
            echo "bound=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 1. Register the run with the Worker (status=running)
        if: steps.guard.outputs.bound == 'true'
        id: register
        run: |
          set -euo pipefail
          gap_json="null"
          if [ -n "${{ inputs.linked_gap_id }}" ]; then gap_json="${{ inputs.linked_gap_id }}"; fi
          printf '{"venture":"%s","task":"%s","linked_gap_id":%s}' \
            "${{ inputs.venture_repo }}" "$(echo "${{ inputs.task }}" | sed 's/"/\\"/g')" "$gap_json" \
            > /tmp/register.json
          code=$(curl -sS -m 25 -o /tmp/register-resp.json -w '%{http_code}' \
            -X POST "https://thehive.sovereignhive.workers.dev/v11/ventures/sandbox-runs" \
            -H "Content-Type: application/json" --data-binary @/tmp/register.json)
          cat /tmp/register-resp.json
          [ "$code" = "200" ] || { echo "::error::could not register the run"; exit 1; }
          id=$(python3 -c "import json; print(json.load(open('/tmp/register-resp.json'))['id'])")
          echo "run_id=$id" >> "$GITHUB_OUTPUT"

      - name: 2. Check out the target venture repo, create the work branch
        if: steps.guard.outputs.bound == 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ inputs.venture_repo }}.git" /tmp/venture-checkout
          cd /tmp/venture-checkout
          git checkout -b "kai/sandbox-run-${{ steps.register.outputs.run_id }}"

      # THEHIVE itself, checked out to a fixed path — this is where automaton/
      # (the step-3 engine) and scripts/post-founder-gated.sh (used below) live.
      # A second, separate checkout from the target venture repo above on purpose:
      # automaton needs to run FROM its own real source, pointed AT the venture
      # checkout via AUTOMATON_REPO_ROOT, never the other way around.
      - name: 3a. Check out THEHIVE (for automaton/ + scripts/)
        if: steps.guard.outputs.bound == 'true'
        uses: actions/checkout@v4
        with:
          path: thehive-checkout

      - name: 3b. Kai El performs the task — automaton's one-shot ReAct run
        if: steps.guard.outputs.bound == 'true'
        id: work
        env:
          AUTOMATON_REPO_ROOT: /tmp/venture-checkout
        run: |
          set -euo pipefail
          # Fresh, throwaway state per run — never automaton's own real
          # .automaton-home, and never reused between runs.
          export AUTOMATON_HOME="$(mktemp -d)"
          cd thehive-checkout/automaton
          node src/index.js --task "${{ inputs.task }}" > /tmp/task-result.json
          cat /tmp/task-result.json
          # Real signal, not assumed: did the run actually produce a final
          # response, or hit maxTurns/an inference failure with nothing to show?
          has_final=$(python3 -c "import json; d=json.load(open('/tmp/task-result.json')); print('true' if d.get('finalText') else 'false')")
          echo "has_final=$has_final" >> "$GITHUB_OUTPUT"
          if [ "$has_final" != "true" ]; then
            echo "::warning::the run did not reach a final response (see /tmp/task-result.json above) — nothing to commit, stopping honestly at status=running rather than opening an empty PR."
          fi

      - name: 4. Commit and push the branch — only if step 3 produced real changes
        if: steps.guard.outputs.bound == 'true' && steps.work.outputs.has_final == 'true'
        id: push
        run: |
          set -euo pipefail
          cd /tmp/venture-checkout
          if git diff --quiet && git diff --cached --quiet; then
            echo "::warning::the task run reported completion but left no real file changes — nothing to commit, stopping honestly rather than opening an empty PR."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "Kai El (sandbox run)"
          git config user.email "kai-el@thehive.sovereignhive.workers.dev"
          git add -A
          git commit \
            -m "Kai El sandbox run: ${{ inputs.task }}" \
            -m "Run #${{ steps.register.outputs.run_id }} — see venture_sandbox_runs in the Command Center. This branch is the proposal; merging this PR is the founder's real approval, never an automatic merge."
          branch="kai/sandbox-run-${{ steps.register.outputs.run_id }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ inputs.venture_repo }}.git" "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: 5. Open the real PR, then mirror branch/pr_url back to the Worker
        if: steps.guard.outputs.bound == 'true' && steps.push.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          pr_url=$(gh pr create --repo "${{ inputs.venture_repo }}" \
            --title "Kai El sandbox run: ${{ inputs.task }}" \
            --body "Run #${{ steps.register.outputs.run_id }}, dispatched via THEHIVE's kai-sandbox-run.yml. This branch was never pushed to main — merging this PR is the real approval. See venture_sandbox_runs in the Command Center for this run's status." \
            --head "${{ steps.push.outputs.branch }}")
          echo "$pr_url"
          # POST /opened is rate-limited only, not founder-key-gated (same class
          # as /proposals/:id/actioned) — a plain curl, not
          # scripts/post-founder-gated.sh, since that script SKIPS the POST
          # entirely when FOUNDER_KEY isn't set, which would be wrong here: this
          # route needs no founder auth at all, so its real result must not
          # depend on whether that unrelated secret happens to be bound.
          printf '{"branch":"%s","pr_url":"%s"}' "${{ steps.push.outputs.branch }}" "$pr_url" > /tmp/opened.json
          curl -sS -m 25 -X POST \
            "https://thehive.sovereignhive.workers.dev/v11/ventures/sandbox-runs/${{ steps.register.outputs.run_id }}/opened" \
            -H "Content-Type: application/json" --data-binary @/tmp/opened.json
