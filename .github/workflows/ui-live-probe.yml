name: UI Live Probe (real browser)

# Proves the RENDERED app is live — not just the /v11 API. This exists because
# a build-time constant once hardwired the deployed bundle to http://localhost:8000:
# every API-level probe stayed green while the app read OFFLINE on real devices,
# because those probes curled the API directly, never the browser's bundle.
# PR_LESSONS forward-check: probe the rendered app in a real browser.
#
# The dev container cannot reach *.workers.dev (egress proxy), so this runs on a
# GitHub runner — the hive's only real eyes on the deployed UI.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '37 */6 * * *'
  push:
    paths:
      - .github/workflows/ui-live-probe.yml

jobs:
  probe:
    name: Render /app/ in Chromium at mobile + desktop
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Read the committed /app bundle hash (L-04 served-vs-committed)
        id: committed
        run: |
          hash=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' docs/app/index.html | head -1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Committed /app bundle: $hash"

      - name: Probe the live app in a real browser
        env:
          COMMITTED_HASH: ${{ steps.committed.outputs.hash }}
        run: |
          cat > /tmp/probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          const BASE = 'https://thehive.sovereignhive.workers.dev/app/';
          const committed = process.env.COMMITTED_HASH || '';
          const browser = await chromium.launch();
          const failures = [];

          async function run(name, viewport) {
            const ctx = await browser.newContext({ viewport, deviceScaleFactor: 2 });
            const page = await ctx.newPage();
            const consoleErrors = [];
            page.on('console', (m) => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('pageerror', (e) => consoleErrors.push('pageerror: ' + e.message));

            await page.goto(BASE, { waitUntil: 'networkidle', timeout: 45000 });
            // Give useHiveData's first poll time to populate the status bar.
            await page.waitForTimeout(4000);

            const bodyText = (await page.locator('body').innerText()).replace(/\s+/g, ' ');
            const html = await page.content();

            // 1) served bundle == committed bundle (L-04)
            const servedMatch = html.match(/assets\/index-[A-Za-z0-9_-]+\.js/);
            const served = servedMatch ? servedMatch[0] : '(none)';
            if (committed && served !== committed)
              failures.push(`[${name}] served bundle ${served} != committed ${committed} (deploy may still be in flight)`);

            // 2) status bar reads LIVE, not OFFLINE
            const live = /\bLIVE\b/.test(bodyText);
            const offline = /\bOFFLINE\b/.test(bodyText);
            if (!live || offline) failures.push(`[${name}] status bar not LIVE (live=${live} offline=${offline})`);

            // 3) a real agent count (> 0)
            const m = bodyText.match(/Hive\s+(\d+)\s+agents/i);
            const agents = m ? parseInt(m[1], 10) : -1;
            if (!(agents > 0)) failures.push(`[${name}] agent count not > 0 (got ${agents})`);

            // 4) no console/page errors
            if (consoleErrors.length) failures.push(`[${name}] console errors: ${consoleErrors.slice(0,5).join(' | ')}`);

            // 5) mobile-specific: no horizontal overflow + Desktop-view affordance
            if (name === 'mobile') {
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
              if (overflow > 4) failures.push(`[mobile] horizontal overflow ${overflow}px (scrunched/overflowing)`);
              const hasDesktopBtn = /Desktop view/i.test(bodyText);
              if (!hasDesktopBtn) failures.push('[mobile] "Desktop view" button not found');
            }

            await page.screenshot({ path: `/tmp/artifacts/${name}.png`, fullPage: false });
            console.log(`── ${name} (${viewport.width}x${viewport.height}): served=${served} live=${live} agents=${agents} consoleErrors=${consoleErrors.length}`);
            await ctx.close();
          }

          await run('desktop', { width: 1280, height: 800 });
          await run('mobile', { width: 390, height: 844 });
          await browser.close();

          if (failures.length) {
            console.error('::error::UI live probe FAILED:');
            for (const f of failures) console.error('  - ' + f);
            process.exit(1);
          }
          console.log('✅ Rendered app is live at both mobile and desktop: LIVE status, real agents, no overflow, no console errors.');
          EOF
          mkdir -p /tmp/artifacts
          node /tmp/probe.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-live-probe-screenshots
          path: /tmp/artifacts/*.png
          if-no-files-found: warn
