name: Sync Planning Docs → Command Center

# Publishes CAMPAIGN.html and FULL_PLAN.html into docs/ (the ASSETS binding's served
# directory) so the founder can open the REAL documents from inside the Command Center,
# same-origin, via CampaignOverlay.tsx / FullPlanOverlay.tsx — not just their live-summary
# digest cards (roadmap-digest.yml / campaign-roadmap-digest.yml).
#
# This is deliberately NOT the "second hand-maintained copy that drifts" anti-pattern task
# 30 fixed, and not what roadmap-digest.yml's own header comment warns against. The
# docs/*.html files this job writes are BUILD ARTIFACTS — mechanically regenerated on
# every push to their real source, never hand-edited, exactly the same category as
# docs/app/ (a vite build output of frontend/). A build artifact cannot drift from its
# source; only a second hand-authored copy can.
#
# Why this cannot become the runaway-automation incident from 2026-08-01 (a chain of
# self-rescheduling firings that snowballed one session's cost): the `on.push.paths`
# trigger below watches ONLY the two real source files and this workflow file itself —
# it never watches docs/**. This job's own commit touches only docs/campaign.html and
# docs/full-plan.html, so it can never appear in its own trigger's path filter and can
# never re-fire itself. One push to the real source produces exactly one sync commit,
# structurally, not by convention.

on:
  workflow_dispatch: {}
  push:
    paths:
      - .claude/tasks/CAMPAIGN.html
      - .claude/tasks/FULL_PLAN.html
      - .github/workflows/sync-planning-docs.yml

permissions:
  contents: write

jobs:
  sync:
    name: Regenerate docs/campaign.html and docs/full-plan.html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the build artifacts
        run: |
          python3 - <<'PYEOF'
          import datetime

          BANNER_HTML = (
              '<!-- GENERATED FILE — DO NOT EDIT.\n'
              '     Source of truth: {src}\n'
              '     Regenerated automatically by .github/workflows/sync-planning-docs.yml\n'
              '     on every push to that file. Hand edits here will be overwritten. -->\n'
          )
          BANNER_BODY = (
              '<div style="position:sticky;top:0;z-index:9999;background:#3a1d00;'
              'color:#ffd27a;font:12px/1.4 monospace;padding:6px 12px;'
              'border-bottom:1px solid #7a4a00;">'
              '⚠ Generated copy — source of truth is <code>{src}</code>, synced automatically. '
              'Do not edit this file directly.'
              '</div>'
          )

          def publish(src, dst):
              html = open(src, encoding='utf-8').read()
              html = BANNER_HTML.format(src=src) + html
              # Drop a visible on-page banner right after <body ...> (or the first <body>
              # if it carries no attributes) so it's obvious in the rendered iframe too,
              # not only in view-source.
              marker = '<body>'
              idx = html.find(marker)
              if idx == -1:
                  # tolerate a <body ...> with attributes, though neither source file has one today
                  import re
                  m = re.search(r'<body[^>]*>', html)
                  if m:
                      idx, marker = m.start(), m.group(0)
              if idx != -1:
                  insert_at = idx + len(marker)
                  html = html[:insert_at] + BANNER_BODY.format(src=src) + html[insert_at:]
              open(dst, 'w', encoding='utf-8').write(html)
              print(f'{src} -> {dst} ({len(html)} bytes)')

          publish('.claude/tasks/CAMPAIGN.html', 'docs/campaign.html')
          publish('.claude/tasks/FULL_PLAN.html', 'docs/full-plan.html')
          print(f'built at {datetime.datetime.utcnow().isoformat()}Z')
          PYEOF

      - name: Commit and push only if the artifacts actually changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/campaign.html docs/full-plan.html
          if git diff --cached --quiet; then
            echo "no change — artifacts already up to date, nothing to commit"
            exit 0
          fi
          git commit -m "$(cat <<'EOF'
          [ROLE: Federation Engineer] Regenerate docs/campaign.html + docs/full-plan.html

          Automated, mechanical rebuild from .claude/tasks/{CAMPAIGN,FULL_PLAN}.html —
          not a hand edit. See sync-planning-docs.yml's own header for why this is a
          build artifact, not the second-copy anti-pattern task 30 fixed.
          EOF
          )"
          git push
