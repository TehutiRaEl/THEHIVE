name: Receive Constitution Update

on:
  repository_dispatch:
    types: [constitution_update]

jobs:
  sync:
    name: Pull soul.md from Queen and verify hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Download canonical soul.md from Queen (with exponential backoff retry)
        run: |
          QUEEN_URL="https://raw.githubusercontent.com/TehutiRaEl/sovereign-hive-meta/main/soul.md"
          MAX_ATTEMPTS=5
          DELAY=2
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $attempt/$MAX_ATTEMPTS..."
            if curl -fsSL "$QUEEN_URL" -o soul.md; then
              echo "Downloaded successfully on attempt $attempt"
              break
            fi
            if [ $attempt -eq $MAX_ATTEMPTS ]; then
              echo "All $MAX_ATTEMPTS attempts failed. Queen may be unreachable."
              exit 1
            fi
            echo "Failed. Retrying in ${DELAY}s..."
            sleep $DELAY
            DELAY=$((DELAY * 2))
          done

      - name: Verify hash matches dispatch payload
        run: |
          expected="${{ github.event.client_payload.soul_md_hash }}"
          actual=$(sha256sum soul.md | cut -d' ' -f1)
          if [ "$expected" != "$actual" ]; then
            echo "Hash mismatch! Expected $expected, got $actual"
            exit 1
          fi
          echo "Hash verified: $actual"

      - name: Commit updated soul.md if changed
        run: |
          git config user.name "Sovereign Hive Bot"
          git config user.email "bot@sovereignhive.io"
          git add soul.md
          git diff --staged --quiet && echo "soul.md unchanged" || \
            git commit -m "chore: sync soul.md from Queen (hash: ${{ github.event.client_payload.soul_md_hash }})"

      - name: Push changes
        run: git push origin main
        continue-on-error: true
