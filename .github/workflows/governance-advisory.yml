name: Governance Advisory Check
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: "Check PR title for [ROLE: ...] tag"
        run: |
          MSG="${{ github.event.pull_request.title }}"
          if ! echo "$MSG" | grep -qE '\[ROLE: [^]]+\]'; then
            echo "::warning::PR title is missing a [ROLE: <Role Title>] tag. See docs/GOVERNANCE.md."
          fi
      - name: Scan for likely secrets (shaped strings, not bare words)
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" -- . | grep -nE '(api[_-]?key|secret|token)["\x27]?\s*[:=]\s*["\x27][A-Za-z0-9_-]{16,}["\x27]' && \
            echo "::warning::Possible secret-shaped value in diff. Please verify nothing sensitive was committed." || true
      - name: Flag code changes without doc updates
        run: |
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$CHANGED" | grep -qE '\.(py|ts|tsx|js|go)$' && ! echo "$CHANGED" | grep -qE '(docs/|README|\.md$)'; then
            echo "::warning::Code changed with no docs/README update. Confirm this is intentional."
          fi
          exit 0
      - name: Constitution hash cross-check
        run: |
          SOUL_FILE="soul.md"
          if [ ! -f "$SOUL_FILE" ]; then
            echo "::warning::soul.md not found at repo root — constitution cannot be verified."
            exit 0
          fi
          QUEEN_HASH=$(sha256sum "$SOUL_FILE" | awk '{print $1}')
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$CHANGED" | grep -q "soul.md"; then
            echo "::warning::soul.md was modified in this PR. Constitution hash will change from $QUEEN_HASH. Verify this is an intentional amendment (requires 2/3 guild vote + 30-day window per soul.md amendment process)."
          else
            echo "Constitution hash stable: ${QUEEN_HASH:0:16}… (soul.md unchanged in this PR)"
          fi
