name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=backend --cov-report=xml --cov-report=term-missing --cov-fail-under=45

      - name: Run integration tests
        run: pytest tests/integration/ -v
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # The Worker had zero automated tests until 2026-08-07 (task 15). A previous session
  # wrote real assertions against the provider-routing logic and left them in a scratch
  # directory that dies with the container — this job exists so that cannot happen again:
  # tests nobody runs automatically rot the same way, just more slowly.
  #
  # Separate job, not a step in the Python one: different runtime, and a Worker
  # regression should be readable as a Worker failure rather than buried in a pytest log.
  # Zero dependencies — Node 22's built-in node:test only, same precedent as automaton/.
  worker:
    name: Test (Worker, Node 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax-check the Worker
        run: node --check worker/src/index.js

      - name: Run Worker tests
        run: npm test --prefix worker
