name: Deploy to Oracle Cloud

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      # The Oracle Always Free box is part of the vision but not provisioned
      # yet. Until its secrets exist, skip gracefully instead of failing after
      # every CI run (this workflow accumulated 165 straight failures that way).
      - name: Check deploy target is provisioned
        id: provisioned
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          if [ -z "$ORACLE_HOST" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "⏸ Oracle box not provisioned yet (secrets.ORACLE_HOST unset) — skipping deploy." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        if: steps.provisioned.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ~/sovereign-hive
            git pull
            docker-compose down
            docker-compose up -d --build
            # Remove only dangling images — not all unused ones
            docker image prune -f
            # Wait for startup, then verify health
            sleep 30
            curl -f http://localhost:8080/v11/health || exit 1
            # Tier 3 status is best-effort
            curl -sf http://localhost:8080/tier3/status || echo "⚠️  Tier 3 status check skipped"
