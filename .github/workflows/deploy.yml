name: Deploy to Oracle Cloud

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ~/sovereign-hive
            git pull
            docker-compose down
            docker-compose up -d --build
            # Remove only dangling images — not all unused ones
            docker image prune -f
            # Wait for startup, then verify health
            sleep 30
            curl -f http://localhost:8080/v11/health || exit 1
            # Tier 3 status is best-effort
            curl -sf http://localhost:8080/tier3/status || echo "⚠️  Tier 3 status check skipped"
