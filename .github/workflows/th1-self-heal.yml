name: TH-1 Self-Heal Wire
on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/th1-self-heal.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok/th1-index-wire-2026-08-29
          fetch-depth: 0
      - name: Restore index.js from known-good SHA and apply patch
        run: |
          set -euo pipefail
          git show c56d518814aad8da5a399d1afd1696957f6ca891:worker/src/index.js > worker/src/index.js
          if [ -f docs/TH1_INDEX_WIRE.patch ]; then
            git apply docs/TH1_INDEX_WIRE.patch
          else
            echo "Missing docs/TH1_INDEX_WIRE.patch" >&2
            exit 1
          fi
          node --check worker/src/index.js
          git config user.name "th1-self-heal"
          git config user.email "th1-self-heal@users.noreply.github.com"
          git add worker/src/index.js
          git diff --cached --stat
          git commit -m "TH-1: self-heal restore + surgical townhall wire (three anchors)" || echo "No changes"
          git push origin HEAD:grok/th1-index-wire-2026-08-29
