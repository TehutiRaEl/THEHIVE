name: Providers Self-Heal Wire
on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/providers-self-heal.yml
      - scripts/apply-providers-wire.py
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: grok/providers-wire-2026-09-17
          fetch-depth: 0
      - name: Apply DeepSeek + Kimi surgical wire
        run: |
          set -euo pipefail
          python3 scripts/apply-providers-wire.py
          node --check worker/src/index.js
          grep -n "deepseek\|kimi" worker/src/index.js | head -30
          git config user.name "providers-self-heal"
          git config user.email "providers-self-heal@users.noreply.github.com"
          git add worker/src/index.js
          git diff --cached --stat
          git commit -m "providers: wire DeepSeek + Kimi into PROVIDERS + generate attempts" || echo "No changes"
          git push origin HEAD:grok/providers-wire-2026-09-17
