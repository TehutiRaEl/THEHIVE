name: Grok Bridge — Sandbox Sync Receiver

on:
  repository_dispatch:
    types: [grok-push]
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Run in test mode (no commit)"
        required: false
        default: "false"

jobs:
  receive:
    name: Receive and commit Grok's sandbox files
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout grok-strategist-main
        uses: actions/checkout@v4
        with:
          ref: grok-strategist-main
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Validate payload
        id: validate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Test dispatch — no files to write"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES='${{ toJson(github.event.client_payload.files) }}'
          if [ -z "$FILES" ] || [ "$FILES" = "null" ]; then
            echo "::error::No files in payload. client_payload.files must be a JSON array."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "message=${{ github.event.client_payload.message || 'grok-bridge sync' }}" >> "$GITHUB_OUTPUT"

      - name: Write files from payload
        if: steps.validate.outputs.skip == 'false'
        env:
          FILES_JSON: ${{ toJson(github.event.client_payload.files) }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, json, base64

          files_raw = os.environ.get("FILES_JSON", "[]")
          try:
              files = json.loads(files_raw)
          except json.JSONDecodeError as e:
              print(f"::error::Invalid JSON in client_payload.files: {e}")
              sys.exit(1)

          if not isinstance(files, list):
              print("::error::client_payload.files must be a JSON array")
              sys.exit(1)

          for f in files:
              path = f.get("path", "").strip()
              content_b64 = f.get("content", "")
              if not path or "/" in path and path.startswith("/"):
                  print(f"::warning::Skipping unsafe path: {path}")
                  continue
              # Block path traversal
              if ".." in path.split("/"):
                  print(f"::warning::Skipping traversal attempt: {path}")
                  continue
              parent = os.path.dirname(path)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(path, "wb") as out:
                  out.write(base64.b64decode(content_b64))
              print(f"Written: {path}")
          PYEOF

      - name: Commit and push
        if: steps.validate.outputs.skip == 'false'
        run: |
          git config user.name "grok-bridge[bot]"
          git config user.email "grok-bridge@sovereign-hive.local"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit — files already up to date."
          else
            git commit -m "[ROLE: Strategist] bridge(sync): ${{ steps.validate.outputs.message }}"
            git push origin grok-strategist-main
            echo "Committed and pushed to grok-strategist-main ✅"
          fi
