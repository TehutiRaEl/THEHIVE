<!-- ══════════════════════════════════════ BACKEND DETECTION ══ -->
<script>
// GitHub Pages has no same-origin backend: let visitors point at one with
// ?backend=https://my-hive-host (persisted) — ?backend=clear forgets it.
(function(){
  try {
    const qp = new URLSearchParams(window.location.search).get('backend');
    if (qp === 'clear') localStorage.removeItem('jasper_backend');
    else if (qp) localStorage.setItem('jasper_backend', qp.replace(/\/+$/,''));
    const saved = localStorage.getItem('jasper_backend');
    if (saved && !window.JASPER_BACKEND) window.JASPER_BACKEND = saved;
  } catch {}
})();

window._BACKEND_CANDIDATES = [
  window.JASPER_BACKEND,
  window.location.origin !== 'null' && !window.location.origin.includes('github.io')
    ? window.location.origin : null,
  'https://thehive.sovereignhive.workers.dev',  // production Queen (Cloudflare edge)
  'http://localhost:8080',
  'http://localhost:8181',
].filter(Boolean);

window.BACKEND_BASE = null;
window.BACKEND_ONLINE = false;

async function detectBackend() {
  for (const base of window._BACKEND_CANDIDATES) {
    try {
      const r = await fetch(base + '/v11/health', { signal: AbortSignal.timeout(3500) });
      if (r.ok) {
        window.BACKEND_BASE = base + '/v11';
        window.BACKEND_ONLINE = true;
        console.log('[hive] backend online:', base);
        return true;
      }
    } catch {}
  }
  window.BACKEND_BASE = null;
  window.BACKEND_ONLINE = false;
  return false;
}

// ── Automatic boot sequence ─────────────────────────────────
// 1) quick probe  2) patient wake loop (free-tier engines cold-start
// in 30–90s)  3) no engine anywhere → enter built-in SIMULATION so the
// Command Center always opens.
window.HIVE_DEMO = false;
window.BOOT_DONE = false;

function _bootUI(status, pct, hint) {
  const s = document.getElementById('boot-status');
  const f = document.getElementById('boot-fill');
  const h = document.getElementById('boot-hint');
  if (s && status !== null) s.textContent = status;
  if (f && pct !== null) f.style.width = pct + '%';
  if (h && hint !== undefined) h.textContent = hint;
}

function _bootFinish(mode) {
  window.BOOT_DONE = true;
  _bootUI(mode === 'live' ? '⬢ hive online — entering command center'
                          : '⬡ no live hive found — entering simulation', 100);
  if (mode === 'demo') {
    window.HIVE_DEMO = true;
    window.BACKEND_BASE = 'DEMO';
    window.BACKEND_ONLINE = true;
    document.getElementById('demo-banner').classList.add('show');
  }
  setTimeout(() => {
    document.getElementById('boot-screen').classList.add('done');
    window.dispatchEvent(new Event('hive-boot-done'));
  }, 700);
}

async function bootSequence() {
  _bootUI('locating a live hive…', 12, '');
  if (await detectBackend()) return _bootFinish('live');

  // A configured remote hive may just be cold — keep knocking.
  const hasRemote = !!window.JASPER_BACKEND;
  const windowMs = hasRemote ? 75000 : 12000;
  _bootUI(hasRemote ? 'waking the hive — free-tier engines can take up to a minute…'
                    : 'no local hive answered — listening a little longer…', 20,
          hasRemote ? window.JASPER_BACKEND : 'tip: run the backend locally, or add ?backend=https://your-hive to this URL');
  const t0 = Date.now();
  while (Date.now() - t0 < windowMs) {
    await new Promise(r => setTimeout(r, 4000));
    _bootUI(null, 20 + ((Date.now() - t0) / windowMs) * 70);
    if (await detectBackend()) return _bootFinish('live');
  }
  _bootFinish('demo');
}

bootSequence();
</script>

<script>
/* When no live hive exists, the Command Center runs on this in-browser
   simulation instead of dying at a splash screen. Same JSON shapes as the
   real /v11 API, served from memory. */
window.DemoHive = (() => {
  const AGENTS = ["Ma'at","Kai El","Solomon","Nanuet","Thoth","Sekhmet","Ptah","Horus"];
  const elo = {}, soul = {};
  AGENTS.forEach((a,i) => { elo[a] = 1200 + ((i*137)%600); soul[a] = 100 + ((i*271)%900); });
  let nextId = 1;
  const challenges = [
    {id:nextId++, challenger:"Ma'at", challenged:"Solomon", proposition:"order precedes wisdom", status:"pending"},
  ];
  const fallen = [
    {proposition:"centralize all memory in one vault", defeated_by:"Nanuet", resurrection_count:1},
    {proposition:"replace the constitution with vibes", defeated_by:"Ma'at", resurrection_count:0},
  ];
  const frames = {}; // challenge_id -> compact frames

  function simulate(chId, a, b) {
    const out = []; const va = new Map(), vb = new Map();
    let wa = 380 + Math.random()*80, wb = 380 + Math.random()*80;
    const COLORS = [[0.1,0.8,0.1],[0.1,0.4,0.9],[0.0,0.9,0.9],[1.0,0.8,0.0]];
    const grow = (m) => {
      const add = [];
      for (let i=0;i<14;i++){
        const x=(Math.random()*16)|0, y=(Math.random()*16)|0, z=(Math.random()*8)|0, k=`${x},${y},${z}`;
        if (m.has(k)) continue;
        const ch=(Math.random()*4)|0, c=COLORS[ch];
        const v={x,y,z,r:c[0],g:c[1],b:c[2],a:+(0.15+Math.random()*0.6).toFixed(3),ch};
        m.set(k,v); add.push(v);
      }
      return add;
    };
    for (let t=0;t<30;t++){
      wa *= 1 + (Math.random()-0.47)*0.03; wb *= 1 + (Math.random()-0.47)*0.03;
      const total = wa + wb;
      out.push({t, m:{tick:t, challenger_wealth:+wa.toFixed(2), challenged_wealth:+wb.toFixed(2),
                      total_wealth:+total.toFixed(2), challenger_share:+(wa/total).toFixed(4),
                      challenged_share:+(wb/total).toFixed(4), leading: wa>wb?a:b},
                da:grow(va), db:grow(vb), dv:[]});
    }
    frames[chId] = out;
    return {winner: wa>wb?a:b, loser: wa>wb?b:a,
            challenger_final_wealth:+wa.toFixed(2), challenged_final_wealth:+wb.toFixed(2),
            ticks_run:30, verdict:`${wa>wb?a:b} prevails with ${Math.max(wa,wb).toFixed(1)} vs ${Math.min(wa,wb).toFixed(1)} colony wealth (simulation)`,
            renderer:"DemoHive in-browser simulation"};
  }

  async function handle(path, opts={}) {
    const method = (opts.method||"GET").toUpperCase();
    const p = path.split("?")[0];
    await new Promise(r=>setTimeout(r, 60+Math.random()*120)); // feel like a network
    if (p === "/auth/token") return {access_token:"demo", token_type:"bearer"};
    if (p === "/health") return {status:"healthy", mode:"simulation"};
    if (p === "/agents") return {agents: AGENTS.map(name=>({name}))};
    if (p === "/grading/leaderboard") return {leaderboard: AGENTS.map(a=>({agent_name:a, rating:elo[a]})).sort((x,y)=>y.rating-x.rating)};
    if (p === "/wallet/leaderboard/soul") return {leaderboard: AGENTS.map(a=>({agent:a, soul:soul[a]})).sort((x,y)=>y.soul-x.soul)};
    if (p === "/tasks") return {tasks:[{id:1,title:"weave the memory graph",status:"in_progress"},{id:2,title:"tune the 7.83 Hz baseline",status:"pending"}]};
    if (p === "/governance/log") return [{action:"simulation_boot", article:"TITLE 0", ts:new Date().toISOString()}];
    if (p === "/llm/status") return {active_provider:"simulation", providers:[]};
    if (p === "/arena/challenges") return {challenges:[...challenges].reverse()};
    if (p === "/arena/fallen") return {hall_of_fallen_ideas: fallen};
    if (p === "/arena/challenge" && method==="POST") {
      const b = JSON.parse(opts.body||"{}");
      const ch = {id:nextId++, challenger:b.challenger, challenged:b.challenged, proposition:b.proposition, status:"pending"};
      challenges.push(ch);
      return {challenge_id: ch.id, status:"pending"};
    }
    const mResolve = p.match(/^\/arena\/resolve\/(\d+)$/);
    if (mResolve && method==="POST") {
      const ch = challenges.find(c=>c.id===+mResolve[1]);
      if (!ch) throw new Error("404");
      ch.status = "completed";
      ch.winner = Math.random()<0.5 ? ch.challenger : ch.challenged;
      return {challenge_id:ch.id, winner:ch.winner, metric:"colony_wealth"};
    }
    const mProject = p.match(/^\/arena\/project\/(\d+)$/);
    if (mProject && method==="POST") {
      const ch = challenges.find(c=>c.id===+mProject[1]);
      if (!ch) throw new Error("404");
      const result = simulate(ch.id, ch.challenger, ch.challenged);
      return {challenge_id:ch.id, arena_winner:ch.winner||null, projection:result,
              frames_url:`/arena/projection/${ch.id}/frames`};
    }
    const mFrames = p.match(/^\/arena\/projection\/(\d+)\/frames$/);
    if (mFrames) {
      const f = frames[+mFrames[1]];
      if (!f) throw new Error("404");
      return {challenge_id:+mFrames[1], total_frames:f.length, frames:f};
    }
    return {};
  }
  return { handle };
})();
</script>

<script>
class CortanaHead {
  constructor(canvas, params={}) {
    this.canvas=canvas;
    this.params={schumannHz:7.83,eloAvg:1200,soulTotal:0,activeFreq:432,hdDim:1024,speaking:false,...params};
    this.time=0;
    this.renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
    this.renderer.setSize(200,200);
    this.renderer.setPixelRatio(window.devicePixelRatio);
    this.renderer.setClearColor(0x000000,0);
    this.scene=new THREE.Scene();
    this.camera=new THREE.PerspectiveCamera(55,1,0.01,50);
    this.camera.position.set(0,0,3.6);
    this.scene.add(new THREE.AmbientLight(0x002244,0.5));
    this.buildFace(); this.buildNeural(); this.buildRings(); this.animate();
  }
  facePoint(phi,theta){const ax=1.05,ay=1.38,az=0.85,x=ax*Math.sin(phi)*Math.cos(theta),y=ay*Math.cos(phi),z=az*Math.sin(phi)*Math.sin(theta),fb=Math.exp(-theta*theta*1.5)*Math.exp(-(phi-1.35)*(phi-1.35)*2);return[x,y,z-fb*.18];}
  featureDensity(phi,theta){const front=Math.exp(-Math.pow(Math.abs(theta)*2,2)),brow=Math.exp(-Math.pow(phi-.95,2)*40)*Math.exp(-theta*theta*4)*2,eyeL=Math.exp(-Math.pow(phi-1.08,2)*60)*Math.exp(-Math.pow(theta-.62,2)*60)*5,eyeR=Math.exp(-Math.pow(phi-1.08,2)*60)*Math.exp(-Math.pow(theta+.62,2)*60)*5,nose=Math.exp(-Math.pow(phi-1.35,2)*30)*Math.exp(-theta*theta*80)*2,lip=Math.exp(-Math.pow(phi-1.68,2)*50)*Math.exp(-Math.pow(theta,2)*18)*4,cheek=Math.exp(-Math.pow(phi-1.30,2)*20)*Math.exp(-Math.pow(Math.abs(theta)-.5,2)*20)*1.5;return front*(1+brow+eyeL+eyeR+nose+lip+cheek);}

<script>
/* Renders /v11/arena/projection frames: two 16×16×8 colonies side by side.
   Fixed camera + slow auto-rotation (no OrbitControls: extra CDN dep and
   pointer-drag would fight the fullscreen Phaser canvas). */
class VoxelArenaViewer {
  constructor(canvas){
    this.canvas=canvas;
    const w=canvas.width||340,h=canvas.height||240;
    this.renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
    this.renderer.setSize(w,h,false);
    this.scene=new THREE.Scene();
    this.camera=new THREE.PerspectiveCamera(45,w/h,0.1,200);
    this.camera.position.set(0,18,34);this.camera.lookAt(0,2,0);
    this.scene.add(new THREE.AmbientLight(0x8899aa,.7));
    const sun=new THREE.DirectionalLight(0xffffff,.8);sun.position.set(10,20,10);this.scene.add(sun);
    this.groups={};this.meshes={};this.maps={};
    ["a","b"].forEach((k,i)=>{
      const g=new THREE.Group();g.position.x=i===0?-11:11;
      const mesh=new THREE.InstancedMesh(
        new THREE.BoxGeometry(.85,.85,.85),
        new THREE.MeshLambertMaterial({transparent:true,opacity:.92}),2048);
      mesh.setColorAt(0,new THREE.Color(1,1,1)); // allocate full color buffer while count=2048 (r128 sizes it from current count)
      mesh.count=0;g.add(mesh);this.scene.add(g);
      const base=this.baseplate(i===0?0x113322:0x113344);g.add(base);
      this.groups[k]=g;this.meshes[k]=mesh;this.maps[k]=new Map();
    });
    this.frames=[];this.idx=0;this._timer=null;this._raf=null;this._disposed=false;
    this._dummy=new THREE.Object3D();this._color=new THREE.Color();
    window.voxelViewer=this;
    this._animate();
  }
  baseplate(color){
    const p=new THREE.Mesh(new THREE.BoxGeometry(16.4,.2,16.4),
      new THREE.MeshLambertMaterial({color,transparent:true,opacity:.5}));
    p.position.y=-.6;return p;
  }
  loadFrames(frames){this.frames=frames||[];this.reset();}
  _upsert(k,v){
    const mesh=this.meshes[k],map=this.maps[k],key=v.x+","+v.y+","+v.z;
    let i=map.get(key);
    if(i===undefined){if(map.size>=2048)return;i=map.size;map.set(key,i);mesh.count=map.size;}
    const s=.3+.7*Math.min(v.a||0,1);
    this._dummy.position.set(v.x-7.5,v.z,v.y-7.5);
    this._dummy.scale.set(s,s,s);this._dummy.updateMatrix();
    mesh.setMatrixAt(i,this._dummy.matrix);
    this._color.setRGB(v.r||.5,v.g||.5,v.b||.5);
    mesh.setColorAt(i,this._color);
  }
  _applyFrame(f){
    (f.da||[]).forEach(v=>this._upsert("a",v));
    (f.db||[]).forEach(v=>this._upsert("b",v));
    ["a","b"].forEach(k=>{const m=this.meshes[k];m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;});
  }
  play(fps=8,onTick=null,onDone=null){
    this.stop();
    this._timer=setInterval(()=>{
      if(this.idx>=this.frames.length){this.stop();if(onDone)onDone();return;}
      const f=this.frames[this.idx++];
      this._applyFrame(f);
      if(onTick)onTick(f);
    },1000/fps);
  }
  stop(){if(this._timer){clearInterval(this._timer);this._timer=null;}}
  reset(){this.stop();this.idx=0;["a","b"].forEach(k=>{this.maps[k].clear();this.meshes[k].count=0;});}
  dispose(){this._disposed=true;this.stop();if(this._raf)cancelAnimationFrame(this._raf);this.renderer.dispose();}
  _animate(){
    if(this._disposed)return;
    this._raf=requestAnimationFrame(()=>this._animate());
    this.groups.a.rotation.y+=.004;this.groups.b.rotation.y-=.004;
    this.renderer.render(this.scene,this.camera);
  }
}
window.VoxelArenaViewer=VoxelArenaViewer;
</script>

  _updateSchumann(){const t=this.weatherT,cx=this.worldW*.5,cy=this.worldH*.5,g=this.schumannEmitter;g.clear();for(let i=0;i<3;i++){const phase=(t*7.83*.12+i/3)%1;g.lineStyle(1.5,0xFFD700,(1-phase)*.15);g.strokeCircle(cx,cy,phase*400);}g.setDepth(4);}

// ── Live API helper ─────────────────────────────────────────
async function api(path, opts={}) {
  const base = window.BACKEND_BASE;
  if(!base) throw new Error('No backend');
  if(base === 'DEMO') return window.DemoHive.handle(path, opts);
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), opts.timeout||10000);

    append('');

      const t0 = performance.now();
      try {

        const ms = Math.round(performance.now()-t0);

    // Git status

      append('');

    // Log tail

    if(logData?.lines?.length) {
      append('');
      append('── BACKEND LOG TAIL ──');
      logData.lines.forEach(l => append(l,'dim'));

            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"3px"}}>
              {["A","C","E","H","I","K","L","M","N","O","Y"].map(ch=>(
                <div key={ch} onClick={async()=>{const d=await api(`/frequency/letter/${ch}`,{headers:ah()}).catch(()=>null);const hz=d?.sound_hz||432;if(window.cortana)window.cortana.update({activeFreq:hz});setFreq(f=>({...f,activeHz:hz}));}} style={{padding:"5px 2px",borderRadius:"4px",textAlign:"center",cursor:"pointer",border:"1px solid rgba(0,200,210,.2)",background:"rgba(0,50,60,.4)"}}>
                  <div style={{fontSize:"12px",fontWeight:"bold",color:"#00CED1"}}>{ch}</div>
                  <div style={{fontSize:"7px",color:"#006677"}}>Hz</div>
                </div>
              ))}
            </div>
          </div>}

          {/* SOUL */}
          {tab==="soul"&&<div>
            <div style={{fontSize:"11px",fontWeight:"bold",color:"#FFD700",marginBottom:"10px"}}>💎 SOUL ECONOMY</div>
            <div style={{fontSize:"9px",color:"#664",marginBottom:"10px",borderLeft:"2px solid #FFD700",paddingLeft:"8px"}}>TITLE XVI: 70% agent / 20% treasury / 10% irrevocable trust.</div>
            {soul.slice(0,8).map((a,i)=>(
              <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 8px",marginBottom:"4px",borderRadius:"6px",background:"rgba(20,15,0,.5)",border:"1px solid rgba(255,215,0,.1)"}}>
                <div><span style={{fontSize:"10px",color:i===0?"#FFD700":i===1?"#aaa":i===2?"#CD7F32":"#666",fontWeight:"bold",marginRight:"8px"}}>{i+1}</span><span style={{fontSize:"10px",color:"#ccc"}}>{a.agent}</span></div>
                <div style={{textAlign:"right"}}><div style={{fontSize:"10px",color:"#FFD700",fontWeight:"bold"}}>{(a.soul||0).toFixed(1)} SOUL</div><div style={{fontSize:"8px",color:"#444"}}>ELO:{a.elo||1200}</div></div>
              </div>
            ))}
            {online&&<div style={{display:"flex",gap:"6px",marginTop:"10px"}}>
              <button style={{padding:"5px 10px",background:"rgba(100,70,0,.4)",border:"1px solid rgba(255,200,0,.3)",borderRadius:"6px",color:"#FFD700",fontSize:"10px",cursor:"pointer"}} onClick={async()=>{const f=prompt("From:");const t=prompt("To:");const a=parseFloat(prompt("Amount:")||"0");if(!f||!t||!a)return;const d=await api('/wallet/tip',{method:"POST",headers:ah(),body:JSON.stringify({from_agent:f,to_agent:t,amount:a})}).catch(()=>null);alert(d?.success?`Tipped ${a} SOUL`:d?.error);load();}}>💸 TIP</button>
            </div>}
          </div>}

          {/* TASKS */}
          {tab==="tasks"&&<div>
            <div style={{fontSize:"11px",fontWeight:"bold",color:"#00ff88",marginBottom:"10px"}}>🏛 TOWN HALL TASKS</div>
            {online&&<button style={{padding:"5px 10px",background:"rgba(0,80,40,.4)",border:"1px solid rgba(0,200,100,.3)",borderRadius:"6px",color:"#00ff88",fontSize:"10px",cursor:"pointer",marginBottom:"10px"}} onClick={async()=>{const t=prompt("Title:");const d=prompt("Description:");if(!t)return;const dt=await api('/tasks',{method:"POST",headers:ah(),body:JSON.stringify({title:t,description:d||"",creator:"Commander"})}).catch(()=>null);alert(`Task ${dt?.task_id} created!`);load();}}>+ CREATE</button>}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"6px",fontSize:"9px"}}>
              {["open","assigned","done"].map(st=>(
                <div key={st}>
                  <div style={{color:st==="open"?"#00ff88":st==="assigned"?"#FFD700":"#444",fontWeight:"bold",marginBottom:"4px",textTransform:"uppercase"}}>{st}</div>
                  {tasks.filter(t=>t.status===st).slice(0,4).map((t,i)=>(
                    <div key={i} style={{padding:"5px 6px",marginBottom:"3px",borderRadius:"4px",background:"rgba(0,20,10,.5)",border:"1px solid rgba(0,200,100,.1)"}}>
                      <div style={{color:"#ccc"}}>{(t.title||"").substring(0,20)}</div>
                      {t.resonance_hz>0&&<div style={{color:"#006644",fontSize:"8px"}}>Ψ {t.resonance_hz?.toFixed(0)}Hz</div>}
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </div>}

          {/* GOVERNANCE */}
          {tab==="gov"&&<div>
            <div style={{fontSize:"11px",fontWeight:"bold",color:"#4169E1",marginBottom:"10px"}}>⚖ JUSTICIA · GOVERNANCE</div>
            <div style={{maxHeight:"300px",overflowY:"auto"}}>
              {govLog.map((e,i)=>(
                <div key={i} style={{padding:"6px 8px",marginBottom:"4px",borderRadius:"5px",borderLeft:`2px solid ${e.decision==="allow"?"#00aa44":"#aa2200"}`,background:"rgba(0,5,20,.5)",fontSize:"9px"}}>
                  <div style={{display:"flex",justifyContent:"space-between"}}><span style={{color:"#88aaff"}}>{e.action_type}</span><span style={{color:e.decision==="allow"?"#00aa44":"#aa2200"}}>{e.decision}</span></div>
                  <div style={{color:"#334",marginTop:"2px"}}>{(e.rationale||"").substring(0,60)}</div>
                  <div style={{color:"#223",fontSize:"8px"}}>{e.actor} → {e.target}</div>
                </div>
              ))}
            </div>
            {online&&<button style={{marginTop:"8px",padding:"5px 10px",background:"rgba(20,30,100,.4)",border:"1px solid rgba(60,80,200,.3)",borderRadius:"6px",color:"#6688ff",fontSize:"10px",cursor:"pointer"}} onClick={async()=>{const d=await api('/constitution/soul_md',{headers:ah()}).catch(()=>null);alert(d?.soul_md?.substring(0,500)+"...");}}>📜 VIEW soul.md</button>}
          </div>}

          {/* LLM */}
          {tab==="llm"&&<div>
            <div style={{fontSize:"11px",fontWeight:"bold",color:"#9400D3",marginBottom:"10px"}}>🤖 LLM GATEWAY — OMNI ROUTE</div>
            {!online&&<div style={{fontSize:"9px",color:"#ff6644",marginBottom:"8px"}}>⚠ Backend offline</div>}
            {llmStatus&&<div>
              <div style={{padding:"8px",borderRadius:"6px",background:"rgba(0,0,30,.5)",border:"1px solid rgba(100,100,255,.2)",marginBottom:"10px"}}>
                <span style={{fontSize:"9px",color:"#446"}}>Active: </span>
                <span style={{fontSize:"10px",fontWeight:"bold",color:"#00ff88"}}>{(llmStatus.active_provider||"?").toUpperCase()}</span>
              </div>
              {(llmStatus.providers||[]).map((p,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 8px",marginBottom:"4px",borderRadius:"5px",background:"rgba(0,5,20,.5)",border:`1px solid rgba(${p.healthy?0:100},${p.healthy?200:50},${p.healthy?100:50},.15)`}}>
                  <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
                    <span style={{width:"6px",height:"6px",borderRadius:"50%",background:p.healthy?"#00ff88":"#ff4444",display:"inline-block"}}/>
                    <span style={{fontSize:"10px",color:"#aaa"}}>{p.id}</span>
                  </div>
                  <div style={{display:"flex",gap:"8px",fontSize:"9px"}}>
                    <span style={{color:"#446"}}>{(p.model||"").substring(0,20)}</span>
                    <span style={{color:"#664"}}>key:{p.has_key?"✓":"✗"}</span>
                    {p.score!=null&&<span style={{color:"#00aa66"}}>◈{(p.score||0).toFixed(2)}</span>}
                  </div>
                </div>
              ))}
            </div>}
          </div>}

          {/* HIVE */}
          {tab==="hive"&&<div>
            <div style={{fontSize:"11px",fontWeight:"bold",color:"#FFD700",marginBottom:"10px"}}>🐝 SOVEREIGN HIVE — COLONY NETWORK</div>
            {[
              {name:"THEHIVE",role:"core",icon:"🏛",color:"#FFD700",desc:"Core Colony — Governance · Agents · Arena"},
              {name:"aether",role:"revenue",icon:"⚙",color:"#E8B4FF",desc:"Revenue Colony — License · SOUL settlement"},
              {name:"automatisch",role:"automation",icon:"🕸",color:"#00FFAA",desc:"Hive Bus — Cross-colony event routing"},
              {name:"kimi-gateway",role:"llm",icon:"🧠",color:"#FF9944",desc:"LLM Gateway — Free model waterfall"},
              {name:"free-programming-books",role:"knowledge",icon:"📚",color:"#88CCFF",desc:"Academy A — RAG corpus"},
              {name:"freeCodeCamp",role:"curriculum",icon:"🎓",color:"#66BBFF",desc:"Academy B — Curriculum"},
              {name:"NAR2",role:"unknown",icon:"🌍",color:"#607D8B",desc:"Private · Role TBD"},
              {name:"4DBRAIN",role:"unknown",icon:"🌍",color:"#607D8B",desc:"Private · Role TBD"},
            ].map((col,i)=>{
              const health=window.HIVE.colonyHealth[col.name],st=health?.status||"unknown";
              return<div key={i} style={{padding:"8px 10px",marginBottom:"5px",borderRadius:"8px",background:"rgba(0,10,25,.6)",border:`1px solid ${col.color}22`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div style={{display:"flex",alignItems:"center",gap:"6px"}}>
                    <span style={{fontSize:"14px"}}>{col.icon}</span>
                    <span style={{fontWeight:"bold",color:col.color,fontSize:"10px"}}>{col.name}</span>
                    <span style={{fontSize:"8px",color:"#446",padding:"1px 4px",border:"1px solid #223",borderRadius:"3px"}}>{col.role}</span>
                  </div>
                  <span style={{fontSize:"9px",color:st==="healthy"?"#00ff88":st==="unknown"?"#888":"#ff4444",fontWeight:"bold"}}>{st}</span>
                </div>
                <div style={{fontSize:"8px",color:"#446",marginTop:"3px"}}>{col.desc}</div>
                <button onClick={()=>setZoomColony(col.name)} style={{marginTop:"5px",fontSize:"8px",padding:"2px 8px",background:"rgba(0,200,100,.08)",border:"1px solid rgba(0,200,100,.25)",borderRadius:"4px",color:"#00ff88",cursor:"pointer",fontFamily:"Courier New"}}>⬡ zoom in</button>
              </div>;
            })}
          </div>}

          {/* GRAPH */}
          {tab==="graph"&&<div style={{height:"calc(100vh - 120px)"}}>
            <div style={{fontSize:"11px",fontWeight:"bold",color:"#00ffaa",marginBottom:"8px"}}>🕸 COLONY NETWORK GRAPH</div>
            <div style={{fontSize:"9px",color:"#246",marginBottom:"8px"}}>D3 force graph · drag nodes · live health from /debug/colony-ping</div>
            <div ref={graphRef} style={{width:"100%",height:"calc(100% - 56px)",background:"rgba(0,5,15,.8)",borderRadius:"8px",border:"1px solid rgba(0,200,100,.15)",overflow:"hidden"}}/>
          </div>}

          {/* MEMORY */}
          {tab==="memory"&&<div>
            <div style={{fontSize:"11px",fontWeight:"bold",color:"#aa88ff",marginBottom:"8px"}}>🧠 OBSIDIAN MEMORY VAULT</div>
            <MemoryPanel/>
          </div>}

          {/* DEBUGGER */}
          {tab==="debug"&&<DebugPanel/>}

        </div>
      )}

      {/* BOTTOM TAB BAR */}
      <div id="hud-bottom" style={{pointerEvents:"auto"}}>
        {TABS.map(t=>(
          <button key={t.id} className={`tab-btn${tab===t.id?" active":""}`} onClick={()=>setTab(tab===t.id?"world":t.id)} style={{pointerEvents:"auto"}}>
            {t.label}
          </button>
        ))}
        <div style={{marginLeft:"auto",fontSize:"10px",color:"#224",fontFamily:"Courier New",paddingRight:"8px",whiteSpace:"nowrap"}}>
          ◉ 7.83 Hz · {new Date().toLocaleTimeString()}
        </div>
      </div>

      {/* COLONY ZOOM-IN SLIDE PANEL */}
      {zoomColony&&React.createElement(React.Fragment,null,React.useEffect(()=>{
        setZoomHealth(null);
        const c=COLONY_BASE_URLS[zoomColony];
        if(!c)return;
        const t0=Date.now();
        fetch(c.url+'/colony/capabilities',{signal:AbortSignal.timeout(4000)})
          .then(r=>r.json()).then(d=>setZoomHealth({status:d.status||'healthy',hash:(d.soul_md_hash||'').slice(0,8),latency:Date.now()-t0}))
          .catch(()=>fetch(c.url+'/colony/health',{signal:AbortSignal.timeout(4000)})
            .then(r=>r.json()).then(d=>setZoomHealth({status:d.status||'healthy',hash:'',latency:Date.now()-t0}))
            .catch(()=>setZoomHealth({status:'offline',hash:'',latency:Date.now()-t0})));
      },[zoomColony]))}
      {zoomColony&&(
        <div style={{position:"fixed",top:0,right:0,width:"min(660px,95vw)",height:"100vh",zIndex:200,display:"flex",flexDirection:"column",background:"rgba(5,10,25,0.97)",borderLeft:"1px solid rgba(0,200,100,.3)",boxShadow:"-8px 0 40px rgba(0,0,0,.7)",pointerEvents:"auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:"10px",padding:"10px 14px",borderBottom:"1px solid rgba(0,200,100,.15)",flexShrink:0}}>
            <span style={{fontSize:"14px"}}>⬡</span>
            <span style={{fontWeight:"bold",color:"#00ff88",fontSize:"11px",letterSpacing:".1em",fontFamily:"Courier New"}}>{zoomColony}</span>
            <span style={{fontSize:"9px",color:"#446",marginLeft:"4px"}}>colony console</span>
            {zoomHealth&&<span style={{fontSize:"9px",fontFamily:"Courier New",padding:"1px 7px",borderRadius:"3px",background:zoomHealth.status==='healthy'?"rgba(0,255,100,.1)":"rgba(255,80,50,.1)",color:zoomHealth.status==='healthy'?"#00ff88":"#ff6644",border:`1px solid ${zoomHealth.status==='healthy'?"rgba(0,255,100,.25)":"rgba(255,80,50,.25)"}`}}>{zoomHealth.status==='healthy'?'✅':'⚠️'} {zoomHealth.status}{zoomHealth.latency?` · ${zoomHealth.latency}ms`:''}{zoomHealth.hash?` · ${zoomHealth.hash}`:''}</span>}
            {!zoomHealth&&<span style={{fontSize:"9px",color:"#446",fontFamily:"Courier New"}}>checking…</span>}
            {colonyConsoleUrl(zoomColony)&&(
              <a href={colonyConsoleUrl(zoomColony)} target="_blank" rel="noreferrer" style={{marginLeft:"auto",fontSize:"9px",color:"#00ccff",textDecoration:"none",border:"1px solid rgba(0,200,255,.2)",padding:"2px 7px",borderRadius:"3px"}}>↗ open</a>
            )}
            <button onClick={()=>setZoomColony(null)} style={{marginLeft:colonyConsoleUrl(zoomColony)?"6px":"auto",background:"rgba(255,50,50,.08)",border:"1px solid rgba(255,50,50,.25)",borderRadius:"4px",color:"#ff6644",cursor:"pointer",fontSize:"10px",padding:"2px 8px",fontFamily:"Courier New"}}>✕</button>
          </div>
          {colonyConsoleUrl(zoomColony)?(
            <iframe
              src={colonyConsoleUrl(zoomColony)}
              style={{flex:1,border:"none",background:"#0a0e1a"}}
              title={`${zoomColony} colony console`}
              sandbox="allow-scripts allow-same-origin allow-forms"
            />
          ):(
            <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:"#446",fontSize:"11px",fontFamily:"Courier New"}}>
              No console URL configured for "{zoomColony}".<br/>
              Add an entry to COLONY_BASE_URLS to enable zoom-in.
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<HUD/>);
</script>
</body>
</html>
