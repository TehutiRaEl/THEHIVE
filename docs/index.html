  <title>Kai EL OS · Sovereign Hive</title>

  <!--
    Front door (2026-07-16): the root now leads to Kai EL OS, the current design.
    It is served from the Cloudflare Worker, not GitHub Pages, on purpose: the OS
    needs the /v11 API same-origin, and only the Worker serves both the app and the
    live API from one origin (GitHub Pages has no API, so the OS would render but
    show no live data). The legacy "SOUL REALM / Town Hall" Command Center is
    preserved and still reachable at ./command-center.html.
  -->

  <link rel="canonical" href="https://thehive.sovereignhive.workers.dev/app/" />

    :root { color-scheme: dark; }

    body {
      background: #0a0a0d;

      font-family: 'Exo 2', system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.25rem; text-align: center; padding: 1.5rem;

    .sigil { width: 96px; height: 96px; animation: spin 24s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sigil circle, .sigil line { stroke: #22d3ee; fill: none; }
    .sigil .core { fill: #e8c15a; stroke: none; }
    h1 { font-family: 'Orbitron', system-ui, sans-serif; letter-spacing: .18em; font-size: 1.1rem; color: #e8c15a; margin: 0; }

    a { color: #22d3ee; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .links { display: flex; gap: 1.25rem; flex-wrap: wrap; justify-content: center; font-size: .8rem; margin-top: .5rem; }
  </style>
</head>
