[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jasper-sovereign-hive"
version = "11.0.0"
description = "Sovereign Hive – Mycelial AI Civilisation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Sovereign Hive Collective", email = "hive@sovereignhive.org"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.4",
    "httpx>=0.28.1",
    "websockets>=14.1",
    "python-jose[cryptography]>=3.3.0",
    "chromadb>=0.5.23",
    "sentence-transformers>=3.3.1",
    "ollama>=0.4.3",
    "numpy>=2.2.1",
    "prometheus-client>=0.21.0",
    "cryptography>=42.0.0",
    "aiosqlite>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/TehutiRaEl/THEHIVE"
Repository = "https://github.com/TehutiRaEl/THEHIVE.git"
Documentation = "https://github.com/TehutiRaEl/THEHIVE/tree/main/docs"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
