[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jasper-sovereign-hive"
version = "1.1.0"
description = "Sovereign Hive – Mycelial AI Civilisation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.4",
    "httpx>=0.28.1",
    "aiosqlite>=0.20.0",
    "websockets>=14.1",
    "cryptography>=44.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "chromadb>=0.5.23",
    "sentence-transformers>=3.3.1",
    "ollama>=0.4.3",
    "numpy>=2.2.1",
    "prometheus-client>=0.21.0",
    "tenacity>=9.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["backend"]
