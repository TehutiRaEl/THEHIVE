worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Security
    server_tokens off;
    client_max_body_size 10m;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=colony:10m rate=120r/m;

    # Upstream: Queen
    upstream thehive {
        server thehive:8080;
        keepalive 32;
    }

    # Upstream: Mind colony (Kimi-K2)
    upstream kimi_k2 {
        server kimi_k2:8002;
        keepalive 16;
    }

    # Upstream: aether commerce
    upstream aether {
        server aether:3000;
        keepalive 16;
    }

    # Upstream: automatisch workflow
    upstream automatisch {
        server automatisch:3000;
        keepalive 16;
    }

    # ─── Main server ──────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Health check (no rate limit)
        location /health {
            proxy_pass http://thehive/health;
            proxy_set_header Host $host;
        }

        # Queen API
        location /v11/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://thehive;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # Colony standard layer — Queen
        location /colony/ {
            limit_req zone=colony burst=30 nodelay;
            proxy_pass http://thehive;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Kimi-K2 LLM gateway
        location /llm/ {
            limit_req zone=api burst=10 nodelay;
            rewrite ^/llm/(.*) /$1 break;
            proxy_pass http://kimi_k2;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 120s;
        }

        # aether commerce colony
        location /commerce/ {
            limit_req zone=api burst=20 nodelay;
            rewrite ^/commerce/(.*) /$1 break;
            proxy_pass http://aether;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # automatisch workflow colony
        location /workflow/ {
            limit_req zone=api burst=20 nodelay;
            rewrite ^/workflow/(.*) /$1 break;
            proxy_pass http://automatisch;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # WebSocket passthrough for THEHIVE /ws
        location /ws {
            proxy_pass http://thehive;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }
    }
}
