version: '3.8'

services:
  # ── LLM Provider ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    command: serve
    networks:
      - hive_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '3.5'
          memory: 16G
        reservations:
          cpus: '2'
          memory: 8G

  # ── IPFS Daemon (Tier 3) ──────────────────────────────────
  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs
    restart: unless-stopped
    volumes:
      - ipfs_data:/data/ipfs
    ports:
      - "5001:5001"
      - "8081:8080"   # IPFS gateway on 8081; backend API owns 8080
    networks:
      - hive_network
    command: daemon --migrate=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/v0/id"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Backend API ──────────────────────────────────────────
  backend:
    build: .
    container_name: jasper-hive
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:8b}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - JASPER_API_KEY=${JASPER_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DB_PATH=/app/data/jasper_memory.db
      - CHROMA_PATH=/app/data/chroma_db
      - HIVE_PHASE=${HIVE_PHASE:-0}
      - ENABLE_GUILDS=${ENABLE_GUILDS:-constitutional,audit,treasury}
      # Tier 3
      - IPFS_API_URL=http://ipfs:5001
      - IBMQ_TOKEN=${IBMQ_TOKEN:-}
      - SOUL_CONTRACT_ADDRESS=${SOUL_CONTRACT_ADDRESS:-}
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL:-}
    volumes:
      - jasper_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
      ipfs:
        condition: service_healthy
    networks:
      - hive_network
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '3.5'
          memory: 20G
        reservations:
          cpus: '2'
          memory: 8G

volumes:
  ollama_data:
  ipfs_data:
  jasper_data:

networks:
  hive_network:
    driver: bridge
