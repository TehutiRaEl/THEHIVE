version: '3.8'

services:
  # ─── Reverse Proxy / Load Balancer ──────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - hive_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ─── Backend API ──────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: jasper-hive
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:8b}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - JASPER_API_KEY=${JASPER_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DB_PATH=/app/data/jasper_memory.db
      - CHROMA_PATH=/app/data/chroma_db
      - HIVE_PHASE=${HIVE_PHASE:-0}
      - ENABLE_GUILDS=${ENABLE_GUILDS:-constitutional,audit,treasury}
      - IPFS_API_URL=http://ipfs:5001
      - IBMQ_TOKEN=${IBMQ_TOKEN:-}
      - SOUL_CONTRACT_ADDRESS=${SOUL_CONTRACT_ADDRESS:-}
      - SEPOLIA_RPC_URL=${SEPOLIA_RPC_URL:-}
      - DECAY_RATE=${DECAY_RATE:-0.95}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
    volumes:
      - jasper_data:/app/data
      - ../logs:/app/logs
    depends_on:
      ollama:
        condition: service_healthy
      ipfs:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hive_network
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '3.5'
          memory: 20G
        reservations:
          cpus: '2'
          memory: 8G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── LLM Provider ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    command: serve
    networks:
      - hive_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '3.5'
          memory: 16G
        reservations:
          cpus: '2'
          memory: 8G

  # ─── IPFS Daemon ──────────────────────────────────────────
  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs
    restart: unless-stopped
    volumes:
      - ipfs_data:/ipfs
      - ipfs_data:/ipns
    ports:
      - "5001:5001"
      - "8080:8080"
    networks:
      - hive_network
    command: daemon
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/v0/id"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hive123}
      POSTGRES_DB: sovereign_hive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - hive_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - hive_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ─── Prometheus ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - hive_network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ─── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - hive_network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  ollama_data:
  ipfs_data:
  jasper_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  hive_network:
    driver: bridge
