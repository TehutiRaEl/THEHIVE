# Prometheus Configuration — Sovereign Hive v11.0
# Metrics scraping for monitoring and alerting

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'jasper-hive'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  # - "alerts.yml"

scrape_configs:
  # ─── Backend API ──────────────────────────────────────────
  - job_name: 'jasper-api'
    metrics_path: '/v11/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'api'
          version: '11.0'

  # ─── Node Exporter (system metrics) ──────────────────────
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'
