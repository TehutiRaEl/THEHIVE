# Nginx Configuration — Sovereign Hive v11.0
# Reverse proxy with load balancing for production deployment

upstream hive_backend {
    # Load balancing with sticky sessions
    least_conn;
    server backend:8080 max_fails=3 fail_timeout=30s;
    # Add more backend replicas as needed
    # server backend2:8080 max_fails=3 fail_timeout=30s;
    # server backend3:8080 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=hive_limit:10m rate=10r/s;
    limit_req zone=hive_limit burst=20 nodelay;

    # Proxy timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    # ─── API Routes ────────────────────────────────────────────
    location / {
        proxy_pass http://hive_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ─── WebSocket ─────────────────────────────────────────────
    location /v11/ws {
        proxy_pass http://hive_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # ─── Static Files ──────────────────────────────────────────
    location /ui/ {
        alias /app/frontend/;
        try_files $uri $uri/ /ui/index.html;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # ─── Health Check ──────────────────────────────────────────
    location /health {
        proxy_pass http://hive_backend/v11/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ─── Metrics ───────────────────────────────────────────────
    location /metrics {
        proxy_pass http://hive_backend/v11/metrics;
        proxy_set_header Host $host;
        # Restrict to internal networks in production
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # deny all;
    }

    # ─── Documentation ─────────────────────────────────────────
    location /docs {
        proxy_pass http://hive_backend/docs;
        proxy_set_header Host $host;
    }
}
